version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: ["-addr", ":8080", "-upstream", "http://upstream-service:8081", "-capacity", "100", "-rate", "25"]
    depends_on:
      - upstream-service
      - redis

  upstream-service:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/upstream", "-port", "8081"]
    expose:
      - "8081"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
